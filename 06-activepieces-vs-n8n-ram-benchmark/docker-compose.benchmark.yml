version: "3.8"

services:
  # ============================================================================
  # ACTIVEPIECES BENCHMARK SERVICE (MEMORY CAPPED AT 400MB)
  # ============================================================================
  activepieces:
    image: activepieces/activepieces:0.39.0
    container_name: benchmark_activepieces
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 400M
    ports:
      - "8080:80"
    environment:
      - AP_ENVIRONMENT=production
      - AP_FRONTEND_URL=http://your-vps-ip:8080
      - AP_WEBHOOK_TIMEOUT_SECONDS=30
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${AP_JWT_SECRET}
      - AP_POSTGRES_DATABASE=activepieces
      - AP_POSTGRES_HOST=postgres_ap
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=ap_admin
      - AP_POSTGRES_PASSWORD=${AP_DB_PASSWORD}
      - AP_REDIS_HOST=redis_ap
      - AP_REDIS_PORT=6379
      - AP_EXECUTION_MODE=UNSANDBOXED
      - AP_TELEMETRY=false
    depends_on:
      postgres_ap:
        condition: service_healthy
    networks:
      - benchmark_net

  postgres_ap:
    image: postgres:16-alpine
    container_name: benchmark_postgres_ap
    restart: always
    command: postgres -c shared_buffers=64MB -c max_connections=25
    deploy:
      resources:
        limits:
          memory: 100M
    environment:
      - POSTGRES_DB=activepieces
      - POSTGRES_USER=ap_admin
      - POSTGRES_PASSWORD=${AP_DB_PASSWORD}
    volumes:
      - ap_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap_admin -d activepieces"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - benchmark_net

  redis_ap:
    image: redis:7-alpine
    container_name: benchmark_redis_ap
    restart: always
    command: redis-server --appendonly yes --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks:
      - benchmark_net

  # ============================================================================
  # N8N BENCHMARK SERVICE (MEMORY CAPPED AT 400MB)
  # ============================================================================
  n8n:
    image: n8nio/n8n:1.64.0
    container_name: benchmark_n8n
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 400M
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=your-vps-ip
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://your-vps-ip:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n_admin
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    depends_on:
      postgres_n8n:
        condition: service_healthy
    networks:
      - benchmark_net

  postgres_n8n:
    image: postgres:16-alpine
    container_name: benchmark_postgres_n8n
    restart: always
    command: postgres -c shared_buffers=64MB -c max_connections=25
    deploy:
      resources:
        limits:
          memory: 100M
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n_admin
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_admin -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - benchmark_net

volumes:
  ap_db_data:
  n8n_db_data:

networks:
  benchmark_net:
    name: benchmark_internal_network
