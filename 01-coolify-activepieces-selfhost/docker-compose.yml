# ==============================================================================
# PRODUCTION DOCKER COMPOSE: ACTIVEPIECES ON COOLIFY (APEX V11.0 VERIFIED)
# Architecture: Activepieces Core + PostgreSQL 14 + Redis 7 Alpine
# Reverse Proxy: Automated via Traefik (Coolify Managed)
# ==============================================================================

version: '3.8'

services:
  activepieces:
    image: activepieces/activepieces:latest
    container_name: activepieces_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AP_ENVIRONMENT=production
      - AP_ENGINE_EXECUTOR_MODE=UNSANDBOXED
      - AP_FRONTEND_URL=${AP_FRONTEND_URL}
      - AP_WEBHOOK_TIMEOUT_SECONDS=30
      - AP_POSTGRES_DATABASE=${POSTGRES_DB}
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=${POSTGRES_USER}
      - AP_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AP_REDIS_HOST=redis
      - AP_REDIS_PORT=6379
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${AP_JWT_SECRET}
    volumes:
      - activepieces_data:/root/.activepieces
    networks:
      - coolify-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/v1/flags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:14-alpine
    container_name: activepieces_postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coolify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: activepieces_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - coolify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  activepieces_data:
    name: activepieces_data
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data

networks:
  coolify-network:
    external: true